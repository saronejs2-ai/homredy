<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homredy – Know Before You Move</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #1D3C5A; --sage: #A3B18A; --sage-dark: #7D9168; --bg: #F5F5F5; --white: #FFFFFF; --gray-200: #E5E7EB; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #374151; }
    .page { display: none; }
    .page.active { display: block; }
    .success-box { display: none; padding: 24px; background: #F0FDF4; border: 1px solid #86EFAC; text-align: center; }
    .success-box.show { display: block; }
    .btn-primary { background: var(--navy); color: white; padding: 13px 28px; border-radius: 100px; cursor: pointer; border: none; }
    .review-card { background: white; padding: 24px; border: 1px solid var(--gray-200); margin-bottom: 16px; border-radius: 14px; }
  </style>
</head>
<body>

<nav style="padding: 20px; background: white; border-bottom: 1px solid #ddd;">
  <div style="max-width: 1120px; margin: auto; display: flex; justify-content: space-between;">
    <a style="font-weight: 800; color: #1D3C5A; cursor: pointer;" onclick="showPage('home')">Homredy</a>
    <div>
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('browse')">Browse</button>
      <button onclick="showPage('submit')">Submit</button>
    </div>
  </div>
</nav>

<div class="page active" id="page-home">
  <section style="padding: 100px 20px; text-align: center;">
    <h1>Know Before You Move</h1>
    <button class="btn-primary" onclick="showPage('browse')">Read Reviews</button>
  </section>
</div>

<div class="page" id="page-browse">
  <div style="max-width: 1120px; margin: auto; padding: 40px;">
    <h1>Browse Reviews</h1>
    <div id="browseGrid">Loading reviews...</div>
  </div>
</div>

<div class="page" id="page-submit">
  <div style="max-width: 800px; margin: auto; padding: 40px;">
    <h1>Share Your Experience</h1>
    <div class="success-box" id="submitSuccess"><h3>Review submitted!</h3></div>
    <form id="reviewForm" onsubmit="window.submitReview(event)">
      <input name="property" placeholder="Property Name" required style="width:100%; padding: 10px; margin: 10px 0;">
      <input name="city" placeholder="City" required style="width:100%; padding: 10px; margin: 10px 0;">
      <textarea name="text" placeholder="Your review..." required style="width:100%; height: 100px; margin: 10px 0;"></textarea>
      <button type="submit" class="btn-primary">Submit Review</button>
    </form>
  </div>
</div>

<script>
  // Simple Page Router
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC_sF4yTR_BImsRynqvfmoEydjxMIrrIkM",
    authDomain: "homredy-fb5b0.firebaseapp.com",
    projectId: "homredy-fb5b0",
    storageBucket: "homredy-fb5b0.firebasestorage.app",
    messagingSenderId: "187836764273",
    appId: "1:187836764273:web:e3ac7de304ed1499734bd0",
    measurementId: "G-ZN7YBVDH3R"
  };

  const db = getFirestore(initializeApp(firebaseConfig));

  // 1. Submit Function
  window.submitReview = async function(event) {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target).entries());
    try {
      await addDoc(collection(db, 'Reviews'), { ...data, timestamp: new Date() });
      document.getElementById('reviewForm').style.display = 'none';
      document.getElementById('submitSuccess').classList.add('show');
      window.fetchAndRenderReviews();
    } catch (e) { alert("Error saving."); }
  };

  // 2. Fetch Function
  window.fetchAndRenderReviews = async function() {
    const grid = document.getElementById('browseGrid');
    try {
      const q = query(collection(db, "Reviews"), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);
      grid.innerHTML = snapshot.docs.map(doc => {
        const d = doc.data();
        return `<div class="review-card"><h3>${d.property}</h3><p>${d.text}</p></div>`;
      }).join('');
    } catch (err) { grid.innerHTML = "Error loading reviews."; }
  };

  // Run on start
  window.fetchAndRenderReviews();
</script>

</body>
</html>
